[package]
name = "xfold"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tiny_http = "=0.12.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }
